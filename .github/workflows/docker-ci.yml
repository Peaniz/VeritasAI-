name: VeritasAI Backend CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # MỞ COMMENT ĐOẠN NÀY NẾU BẠN MUỐN PUSH LÊN DOCKER HUB
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: false # Đổi thành true nếu muốn push lên Docker Hub
          tags: your-docker-username/auth-service:latest

      - name: Build AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/ai-service
          file: ./services/ai-service/Dockerfile
          push: false 
          tags: your-docker-username/ai-service:latest

      - name: Build Document Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/document-service
          file: ./services/document-service/Dockerfile
          push: false
          tags: your-docker-username/document-service:latest

      - name: Build Analytics Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/analytics-service
          file: ./services/analytics-service/Dockerfile
          push: false
          tags: your-docker-username/analytics-service:latest
