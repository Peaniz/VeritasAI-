[project]
name = "ai-service"
version = "1.0.0"
description = "VeritasAI AI Detection Microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "confluent-kafka>=2.4.0",
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf>=4.25.0",
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "nltk>=3.8.1",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "deep-translator>=1.11.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
