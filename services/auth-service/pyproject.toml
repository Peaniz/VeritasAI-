[project]
name = "veritas-auth-service"
version = "1.0.0"
description = "Veritas Auth Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "peewee>=3.17.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "confluent-kafka>=2.4.0",
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "protobuf>=4.25.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "stripe>=8.0.0",
    "bcrypt>=4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
