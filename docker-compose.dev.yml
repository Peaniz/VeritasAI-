# ── Veritas – Development Compose ─────────────────────────────────────────────
# Spins up infrastructure (Postgres · Kafka · MinIO) + auth-service with
# hot-reload volumes. Run the frontend separately with `npm run dev`.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down -v   # destroy volumes too

name: veritas-dev

networks:
  veritas_net:
    driver: bridge

volumes:
  postgres_data_dev:
  minio_data_dev:
  kafka_data_dev:

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: veritas_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-veritas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritas_dev_2026}
      POSTGRES_DB:       ${POSTGRES_DB:-veritas_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - veritas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft – no Zookeeper) ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: veritas_kafka_dev
    restart: unless-stopped
    hostname: kafka
    ports:
      - "9092:9092"   # PLAINTEXT – Docker-internal
      - "9094:9094"   # EXTERNAL  – host access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    networks:
      - veritas_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── MinIO (S3-compatible object storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: veritas_minio_dev
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-veritas_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veritas_minio_2026}
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    networks:
      - veritas_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Auth Service ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context:    ./services/auth-service
      dockerfile: Dockerfile
    container_name: veritas_auth_dev
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DEBUG: "true"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-veritas}:${POSTGRES_PASSWORD:-veritas_dev_2026}@postgres:5432/${POSTGRES_DB:-veritas_db}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-veritas_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-veritas_minio_2026}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_32}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Google OAuth
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI:  ${GOOGLE_REDIRECT_URI:-http://localhost/auth/google/callback}
      # Stripe
      STRIPE_SECRET_KEY:          ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY:     ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET:      ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID:        ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      # Quotas
      FREE_DAILY_LIMIT:       ${FREE_DAILY_LIMIT:-10}
      FREE_MAX_CHARS:         ${FREE_MAX_CHARS:-2000}
      PRO_DAILY_LIMIT:        ${PRO_DAILY_LIMIT:-500}
      PRO_MAX_CHARS:          ${PRO_MAX_CHARS:-10000}
      ENTERPRISE_DAILY_LIMIT: ${ENTERPRISE_DAILY_LIMIT:-0}
      ENTERPRISE_MAX_CHARS:   ${ENTERPRISE_MAX_CHARS:-50000}
    volumes:
      # Hot-reload: mount source so changes reflect without rebuild
      - ./services/auth-service:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - veritas_net
